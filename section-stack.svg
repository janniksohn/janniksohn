<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0e1815"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00DC82" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00DC82" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0b0f14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00DC82"/>
      <stop offset="1" stop-color="#00DC82" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="96" rx="14"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .in { animation: in .7s cubic-bezier(.2,.7,.2,1) both; }
      .in2 { animation-delay: .15s }
      @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .rule { transform-origin: 40px 0; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both .25s; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      .t { opacity: 0; animation-name: tile; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
      @keyframes tile { 0%, 100% { opacity: 0 } 45% { opacity: var(--o) } }
      .glow { animation: drift 14s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-140px) } }
      @media (prefers-reduced-motion: reduce) { .in, .rule, .t, .glow { animation: none } .t { opacity: calc(var(--o) * .6) } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="96" fill="url(#bg)"/>
    <ellipse class="glow" cx="1060" cy="48" rx="260" ry="120" fill="url(#glow)"/>
    <rect x="1081" y="25" width="23" height="23" fill="#00DC82" class="t" style="--o:0.39;animation-delay:0.53s;animation-duration:5.76s"/>
    <rect x="937" y="25" width="23" height="23" fill="#00DC82" class="t" style="--o:0.23;animation-delay:3.12s;animation-duration:6.99s"/>
    <rect x="1105" y="1" width="23" height="23" fill="#00DC82" class="t" style="--o:0.42;animation-delay:3.64s;animation-duration:6.22s"/>
    <rect x="961" y="1" width="23" height="23" fill="#00DC82" class="t" style="--o:0.26;animation-delay:5.90s;animation-duration:4.62s"/>
    <rect x="1153" y="73" width="23" height="23" fill="#00DC82" class="t" style="--o:0.47;animation-delay:5.21s;animation-duration:6.06s"/>
    <rect x="865" y="25" width="23" height="23" fill="#00DC82" class="t" style="--o:0.15;animation-delay:3.46s;animation-duration:5.30s"/>
    <rect x="1129" y="25" width="23" height="23" fill="#00DC82" class="t" style="--o:0.45;animation-delay:5.66s;animation-duration:6.17s"/>
    <rect x="937" y="73" width="23" height="23" fill="#00DC82" class="t" style="--o:0.23;animation-delay:0.89s;animation-duration:6.09s"/>
    <rect x="889" y="1" width="23" height="23" fill="#00DC82" class="t" style="--o:0.18;animation-delay:0.18s;animation-duration:5.34s"/>
    <rect x="1177" y="1" width="23" height="23" fill="#00DC82" class="t" style="--o:0.50;animation-delay:1.92s;animation-duration:4.81s"/>
    <rect x="1081" y="1" width="23" height="23" fill="#00DC82" class="t" style="--o:0.39;animation-delay:4.69s;animation-duration:6.75s"/>
    <rect x="1033" y="49" width="23" height="23" fill="#00DC82" class="t" style="--o:0.34;animation-delay:0.29s;animation-duration:5.59s"/>
    <rect x="889" y="49" width="23" height="23" fill="#00DC82" class="t" style="--o:0.18;animation-delay:2.61s;animation-duration:6.05s"/>
    <rect x="985" y="1" width="23" height="23" fill="#00DC82" class="t" style="--o:0.28;animation-delay:1.08s;animation-duration:5.81s"/>
    <rect width="1200" height="96" fill="url(#grid)"/>
    <rect width="620" height="96" fill="url(#fadeL)" opacity="0.85"/>

    <text x="38" y="50" class="sans in" font-size="34" font-weight="700" letter-spacing="-0.8" fill="#f2f5f7">Stack</text>
    <text x="40" y="74" class="sans in in2" font-size="15" fill="#7d8a95">Womit ich baue</text>
    <rect class="rule" x="40" y="94.5" width="320" height="1.5" fill="url(#rule)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="95" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>
