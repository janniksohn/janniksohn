<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jannik Sohn — Frontend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0f1a17"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d7fbe9"/>
      <stop offset="1" stop-color="#00DC82"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#00DC82" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00DC82" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="16"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .fade { animation: in .6s ease-out both; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s }
      .d4 { animation-delay: .85s } .d5 { animation-delay: 1.1s }
      @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .orbit { transform-origin: 1010px 160px; animation: spin 40s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      @media (prefers-reduced-motion: reduce) { .fade, .cursor, .orbit { animation: none; opacity: 1 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- window chrome -->
    <circle cx="36" cy="34" r="6" fill="#ff5f57"/>
    <circle cx="56" cy="34" r="6" fill="#febc2e"/>
    <circle cx="76" cy="34" r="6" fill="#28c840"/>
    <text x="600" y="39" text-anchor="middle" class="mono" font-size="13" fill="#6b7a86">~/janniksohn — zsh</text>
    <line x1="0" y1="62" x2="1200" y2="62" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- decorative orbit (Nuxt-ish triangles) -->
    <g class="orbit" opacity="0.9">
      <circle cx="1010" cy="160" r="92" fill="none" stroke="#00DC82" stroke-opacity="0.18" stroke-dasharray="3 7"/>
      <circle cx="1010" cy="160" r="56" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="1102" cy="160" r="5" fill="#00DC82"/>
      <circle cx="954" cy="160" r="3" fill="#3178C6"/>
    </g>
    <clipPath id="lh"><rect x="900" y="80" width="110" height="160"/></clipPath>
    <clipPath id="rh"><rect x="1010" y="80" width="110" height="160"/></clipPath>
    <g clip-path="url(#lh)" transform="translate(-3 0)"><g transform="translate(1010 160) scale(0.19) translate(-256 -256.3)"><path d="M281.44 397.667H438.32C443.326 397.667 448.118 395.908 452.453 393.427C456.789 390.946 461.258 387.831 463.76 383.533C466.262 379.236 468.002 374.36 468 369.399C467.998 364.437 466.266 359.563 463.76 355.268L357.76 172.947C355.258 168.65 352.201 165.534 347.867 163.053C343.532 160.573 337.325 158.813 332.32 158.813C327.315 158.813 322.521 160.573 318.187 163.053C313.852 165.534 310.795 168.65 308.293 172.947L281.44 219.587L227.733 129.13C225.229 124.834 222.176 120.307 217.84 117.827C213.504 115.346 208.713 115 203.707 115C198.701 115 193.909 115.346 189.573 117.827C185.238 120.307 180.771 124.834 178.267 129.13L46.8267 355.268C44.3208 359.563 44.0022 364.437 44 369.399C43.9978 374.36 44.3246 379.235 46.8267 383.533C49.3288 387.83 53.7979 390.946 58.1333 393.427C62.4688 395.908 67.2603 397.667 72.2667 397.667H171.2C210.401 397.667 238.934 380.082 258.827 346.787L306.88 263.4L332.32 219.587L410.053 352.44H306.88L281.44 397.667ZM169.787 352.44H100.533L203.707 174.36L256 263.4L221.361 323.784C208.151 345.387 193.089 352.44 169.787 352.44Z" fill="#00DC82"/></g></g>
    <g clip-path="url(#rh)" transform="translate(3 0)"><g transform="translate(1010 160) scale(0.25) translate(-130.87 -113.35)"><path d="M161.096.001l-30.225 52.351L100.647.001H-.005l130.877 226.688L261.749.001z" fill="#41B883"/><path d="M161.096.001l-30.225 52.351L100.647.001H52.346l78.526 136.01L209.398.001z" fill="#4A6680"/></g></g>
    
    <!-- content -->
    <text x="64" y="112" class="mono fade d1" font-size="18" fill="#00DC82">$ <tspan fill="#9aa7b2">whoami</tspan></text>
    <text x="62" y="178" class="sans fade d2" font-size="60" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Jannik Sohn</text>
    <text x="64" y="218" class="sans fade d3" font-size="22" fill="#c4ccd4">Frontend Developer · Nuxt / Vue · TypeScript</text>
    <g class="fade d4">
      <text x="64" y="268" class="mono" font-size="16" fill="#6b7a86"><tspan fill="#00DC82">$</tspan> building headless frontends &amp; side projects · based in Germany<tspan class="cursor" fill="#00DC82" font-weight="700"> _</tspan></text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
